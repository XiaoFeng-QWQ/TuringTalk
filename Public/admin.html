<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>管理后台 - 图灵测试</title>
    <link rel="icon" type="image/svg+xml" href="favicon-admin.svg">
    <meta name="theme-color" content="#000000">
    <link rel="stylesheet" href="admin.css?v=">
</head>

<body>

    <header>
        <div class="logo-text">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            管理模式
        </div>

        <button class="doodle-btn" id="btn-exit-admin-header" style="display:none;">
            退出管理模式
        </button>
    </header>

    <main>
        <!-- 未登录提示 -->
        <div id="admin-login-prompt" style="text-align:center;padding:80px 20px;">
            <h2>管理后台</h2>
            <p class="text-muted" style="margin-top:8px;">正在连接管理服务...</p>
        </div>

        <!-- 已登录：管理面板 -->
        <div id="admin-panel-content" style="display:none;">

            <!-- 全服公告 -->
            <div class="doodle-border">
                <h4 style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;margin-bottom:8px;">
                    <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                    </svg>
                    全服公告
                </h4>
                <p class="text-muted" style="font-size:12px;margin-bottom:10px;">发送弹幕公告给所有在线玩家</p>
                <div style="display:flex;gap:8px;">
                    <input type="text" id="broadcast-input" placeholder="输入公告内容..." maxlength="100" style="flex:1;">
                    <input type="number" id="broadcast-duration" value="60" min="1" max="3600" step="1" style="width:65px;border:1px solid var(--border);border-radius:6px;padding:6px 4px;font-size:13px;background:var(--surface);color:var(--text);" title="显示时长（秒）">
                    <button class="doodle-btn" id="btn-send-broadcast" style="flex-shrink:0;">发送</button>
                </div>
                <span id="broadcast-status" class="text-sm text-muted" style="display:none;"></span>
            </div>

            <!-- 标签栏 -->
            <div class="admin-tab-bar" style="margin-bottom:16px;">
                <button class="admin-tab-btn active" id="tab-sessions">活跃对局</button>
                <button class="admin-tab-btn" id="tab-reports">举报审核</button>
                <button class="admin-tab-btn" id="tab-stickers">自定义表情包</button>
            </div>

            <!-- 面板：活跃对局 -->
            <div class="setting-row" id="panel-sessions">
                <h4>
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                    活跃对局
                </h4>
                <input type="text" id="search-sessions-input" placeholder="搜索玩家昵称..." style="margin-bottom:8px;">
                <button class="doodle-btn" id="btn-refresh-sessions"
                    style="width:100%;justify-content:center;margin-bottom:8px;">
                    刷新列表
                </button>
                <div id="sessions-list">
                    <div style="text-align:center;color:var(--text-muted);padding:10px;">点击刷新查看</div>
                </div>
            </div>

            <!-- 面板：举报审核 -->
            <div class="setting-row" id="panel-reports" style="display:none;">
                <h4>
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" />
                        <line x1="4" y1="22" x2="4" y2="15" />
                    </svg>
                    举报审核
                </h4>
                <div style="display:flex;gap:6px;margin-bottom:8px;">
                    <button class="doodle-btn report-filter-btn active" data-filter="">全部</button>
                    <button class="doodle-btn report-filter-btn" data-filter="0">未审</button>
                    <button class="doodle-btn report-filter-btn" data-filter="1">已审</button>
                </div>
                <div id="reports-list">
                    <div style="text-align:center;color:var(--text-muted);padding:10px;">加载中...</div>
                </div>
                <div id="reports-pagination"></div>
            </div>

            <!-- 面板：自定义表情 -->
            <div class="setting-row" id="panel-stickers" style="display:none;">
                <h4>
                    <svg class="icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M8 14s1.5 2 4 2 4-2 4-2" />
                        <line x1="9" y1="9" x2="9.01" y2="9" />
                        <line x1="15" y1="9" x2="15.01" y2="9" />
                    </svg>
                    自定义表情
                </h4>
                <div class="sticker-add-form">
                    <label style="font-size:13px;font-weight:500;display:block;margin-bottom:6px;">添加新表情</label>
                    <div style="display:flex;gap:8px;margin-bottom:4px;flex-direction:column;">
                        <input type="text" id="sticker-name-input" placeholder="表情名称（可选）" maxlength="20">
                        <input type="text" id="sticker-url-input" placeholder="图片 URL 或点击下方上传" maxlength="500">
                    </div>
                    <div style="display:flex;gap:8px;margin-bottom:4px;align-items:center;">
                        <label class="doodle-btn" id="btn-sticker-upload"
                            style="flex:1;justify-content:center;cursor:pointer;">
                            <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                                <polyline points="17 8 12 3 7 8" />
                                <line x1="12" y1="3" x2="12" y2="15" />
                            </svg>
                            本地上传
                        </label>
                        <input type="file" id="sticker-file-input" accept="image/*" style="display:none;">
                        <span id="sticker-upload-status" class="text-sm text-muted" style="display:none;"></span>
                    </div>
                    <div id="sticker-preview" style="margin:4px 0;display:none;">
                        <span class="text-sm text-muted">预览：</span>
                        <img id="sticker-preview-img" src="" alt="预览"
                            style="max-width:80px;max-height:80px;vertical-align:middle;border-radius:6px;border:1px solid var(--border);">
                    </div>
                    <button class="doodle-btn" id="btn-add-sticker"
                        style="display:block;width:100%;margin-top:6px;justify-content:center;">
                        添加表情
                    </button>
                </div>
                <div class="sticker-list" id="sticker-list">
                    <div class="text-sm text-muted" style="text-align:center;" id="sticker-list-empty">
                        暂无自定义表情</div>
                </div>
            </div>
        </div>

        <!-- 旁观聊天视图 -->
        <section id="chat-page">
            <div class="notebook-container">
                <div class="chat-header">
                    <div class="opponent-info">
                        <div class="avatar">
                            <svg class="icon" viewBox="0 0 24 24" style="width:22px;height:22px;">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </div>
                        <div>
                            <div class="text-sm text-muted">旁观对局</div>
                            <strong style="font-size:18px;">旁观模式</strong>
                        </div>
                    </div>
                    <div style="text-align:right;">
                        <div class="text-sm text-muted" style="margin-bottom:2px;">状态</div>
                        <div class="timer-sketch" id="timer-display">旁观</div>
                    </div>
                </div>
                <div class="chat-body" id="chat-body"></div>
            </div>
        </section>
    </main>

    <!-- 举报详情弹窗 -->
    <div id="report-detail-overlay" style="display:none;">
        <div
            style="position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:1001;display:flex;align-items:center;justify-content:center;">
            <div class="doodle-border" style="max-width:600px;width:90%;max-height:90vh;overflow-y:auto;margin:0;">
                <h2 id="report-detail-title" style="font-size:18px;color:var(--danger);margin-bottom:12px;">举报详情</h2>
                <div id="report-detail-content" style="font-size:13px;color:var(--text-secondary);"></div>
                <div id="report-detail-chat"
                    style="margin-top:12px;max-height:300px;overflow-y:auto;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius);padding:10px;font-size:12px;">
                </div>
                <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px;">
                    <button class="doodle-btn" id="btn-report-detail-close">关闭</button>
                    <button class="doodle-btn success" id="btn-report-detail-reviewed">标记已审</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 表情大图预览 -->
    <div id="sticker-lightbox" style="display:none;">
        <div class="sticker-lightbox-bg"></div>
        <img id="sticker-lightbox-img" src="" alt="">
        <button id="sticker-lightbox-close" class="doodle-btn"
            style="position:absolute;top:12px;right:12px;z-index:1;">&times;</button>
    </div>

    <script src="shared.js?v="></script>
    <script src="admin.js?v="></script>
</body>

</html>
