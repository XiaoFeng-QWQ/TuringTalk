<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>临时聊天</title>
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="theme-color" content="#2c3e50">
    <meta name="description" content="1v1 私密临时聊天房，邀请在线好友，随时开聊。">
    <link rel="stylesheet" href="/style.css?v=">
    <link rel="stylesheet" href="/lobby/lobby.css?v=">
    <link rel="stylesheet" href="/temp-chat/temp-chat.css?v=">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.8.4/plyr.css">
    <script src="https://cdn.plyr.io/3.8.4/plyr.js"></script>
    <script src="/shared.js?v="></script>
</head>

<body>

    <div id="announcement-area"></div>

    <header>
        <button class="doodle-btn" id="btn-back" style="border-radius: 50%; padding: 10px;" title="返回">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
        </button>

        <div class="logo-text">
            <svg class="icon" viewBox="0 0 24 24" style="width:1.1em;height:1.1em;">
                <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
            </svg>
            临时聊天
        </div>

        <div class="header-actions">
            <button class="doodle-btn" id="btn-theme" title="主题切换" style="padding:8px 8px;">
                <svg class="icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5" />
                    <path d="M12 1v2" />
                    <path d="M12 21v2" />
                    <path d="M4.22 4.22l1.42 1.42" />
                    <path d="M18.36 18.36l1.42 1.42" />
                    <path d="M1 12h2" />
                    <path d="M21 12h2" />
                    <path d="M4.22 19.78l1.42-1.42" />
                    <path d="M18.36 5.64l1.42-1.42" />
                </svg>
            </button>
            <button class="doodle-btn" id="temp-report-btn" title="举报" style="padding:8px 8px;display:none;">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M12 9v4" />
                    <path d="M12 17h.01" />
                    <path
                        d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                </svg>
            </button>
        </div>
    </header>

    <main style="padding: 0;">
        <!-- ==================== 邀请页（便签卡风格） ==================== -->
        <section id="lobby-match-panel">
            <div class="temp-invite-wrap">
                <div class="temp-card doodle-border note-yellow">
                    <h2 class="temp-card-title">邀请好友进入临时聊天</h2>
                    <p class="temp-card-desc">搜索在线用户并发出邀请，双方同意后即可开始私密畅聊。<br>房间为一次性，关闭后消息自动销毁。</p>
                    <div class="temp-search-bar">
                        <input type="text" id="temp-search-input" class="temp-search-input" maxlength="20"
                            placeholder="输入昵称搜索在线用户" autocomplete="off">
                        <button class="doodle-btn temp-search-btn" id="temp-search-btn">搜索</button>
                    </div>
                    <div class="temp-search-hint">输入昵称点击搜索，或在输入框留空点击搜索查看全部在线用户</div>
                    <div id="temp-search-results" class="temp-search-results"></div>
                </div>
            </div>
        </section>

        <!-- ==================== 房间页（完全复用聊天室布局） ==================== -->
        <div id="lobby-main">
            <div class="lobby-container">

                <div id="lobby-has-identity" class="lobby-chat" style="display:none;">

                    <!-- 房间顶部条：对方昵称 + 退出 -->
                    <div class="temp-peer-bar" id="temp-peer-bar" style="display:none;">
                        <div class="temp-peer-left">
                            <span class="temp-peer-label">与</span>
                            <span class="temp-peer-avatar" id="temp-peer-avatar"></span>
                            <span class="temp-peer-name" id="temp-peer-name">对方</span>
                            <span class="temp-peer-label">私密畅聊中</span>
                        </div>
                        <button class="doodle-btn" id="temp-exit-btn" style="padding:5px 14px;font-size:13px;">
                            <svg class="icon" viewBox="0 0 24 24" style="width:16px;height:16px;">
                                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                                <polyline points="16 17 21 12 16 7" />
                                <line x1="21" y1="12" x2="9" y2="12" />
                            </svg>
                            退出
                        </button>
                    </div>

                    <div id="lobby-loading" class="lobby-loading">
                        <svg class="bili-spinner" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-dasharray="31.4 31.4" stroke-linecap="round">
                                <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12"
                                    dur="0.8s" repeatCount="indefinite" />
                            </circle>
                        </svg>
                        <span>正在进入房间…</span>
                    </div>

                    <div id="lobby-messages" class="lobby-messages"></div>

                    <button id="lobby-btn-scroll-bottom" class="lobby-scroll-bottom-btn" type="button" title="返回底部"
                        aria-label="返回底部">
                        <svg class="icon" viewBox="0 0 24 24">
                            <line x1="12" y1="4" x2="12" y2="17" />
                            <polyline points="5.5 11 12 17.5 18.5 11" />
                        </svg>
                    </button>

                    <div class="lobby-input-area">
                        <div class="lobby-input-row">
                            <div class="input-inner">
                                <textarea id="lobby-chat-input" placeholder="说点什么..." rows="1" maxlength="1000"
                                    autocomplete="off"></textarea>
                                <button class="sticker-btn" id="lobby-btn-sticker" title="发送表情">
                                    <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;">
                                        <rect x="3" y="3" width="18" height="18" rx="3" />
                                        <circle cx="8.5" cy="8.5" r="1.5" />
                                        <circle cx="15.5" cy="8.5" r="1.5" />
                                        <path d="M8 14c0 0 1.5 2 4 2s4-2 4-2" />
                                    </svg>
                                </button>
                            </div>
                            <button id="lobby-btn-send" class="doodle-btn send-btn">
                                <svg class="icon" viewBox="0 0 24 24">
                                    <line x1="22" y1="2" x2="11" y2="13" />
                                    <polygon points="22 2 15 22 11 13 2 9 22 2" />
                                </svg>
                                发送
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="lobby-overlay" style="display:none;"></div>

    <div id="lobby-sticker-picker" class="sticker-picker" style="display:none;">
        <div class="sticker-picker-header">
            <span>选择表情</span>
            <button class="doodle-btn" id="lobby-btn-close-sticker-picker"
                style="padding:2px 8px;font-size:14px;">&times;</button>
        </div>
        <div class="sticker-picker-tabs">
            <span class="sticker-picker-tab active" data-tab="mine">我的表情</span>
            <span class="sticker-picker-tab" data-tab="default">默认表情</span>
        </div>
        <div class="sticker-picker-body" id="lobby-sticker-picker-body">
            <div style="text-align:center;color:#999;padding:20px;font-size:13px;">暂无可用表情</div>
        </div>
    </div>

    <div id="lobby-sticker-lightbox" style="display:none;">
        <div class="sticker-lightbox-bg"></div>
        <img id="lobby-sticker-lightbox-img" alt="">
        <button id="lobby-sticker-lightbox-close" class="doodle-btn"
            style="position:absolute;top:12px;right:12px;padding:4px 8px;font-size:18px;line-height:1;">&times;</button>
    </div>

    <!-- 顶部邀请提示（收到邀请时弹出） -->
    <div id="temp-invite-toast" class="temp-invite-toast" style="display:none;">
        <span class="temp-invite-text" id="temp-invite-text"></span>
        <button class="doodle-btn temp-invite-yes" id="temp-invite-yes">同意</button>
        <button class="doodle-btn temp-invite-no" id="temp-invite-no">拒绝</button>
    </div>

    <script defer src="https://cloud.umami.is/script.js"
        data-website-id="caab6c43-2fba-4eb5-9654-e1fe179ce0f2"></script>
    <script src="/temp-chat/temp-chat.js?v="></script>
    <script src="/temp-invite.js?v="></script>
    <script>
        // 首页轻量WS收邀请 + 发起面板
        document.addEventListener('DOMContentLoaded', function () {
            if (window.TempInvite) {
                // 本页不额外建 WS，收邀请/发起均复用 temp-chat.js 自己的 /ws/tempchat
                window.TempInvite.init({ autoConnect: false });
                var btn = document.getElementById('btn-temp-invite');
                if (btn) btn.addEventListener('click', function () { window.TempInvite.openPanel(); });
            }
        });
    </script>
</body>

</html>
