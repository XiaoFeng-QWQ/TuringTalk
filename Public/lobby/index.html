<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>公共聊天室</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="theme-color" content="#2c3e50">
    <link href="https://fonts.googleapis.com/css2?family=Pangolin&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css?v=">
    <link rel="stylesheet" href="/lobby/lobby.css?v=">
    <script src="https://testingcf.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
    <script src="/shared.js?v="></script>
</head>
<body>

    <div id="announcement-area"></div>

    <header>
        <button class="doodle-btn" id="btn-back" style="border-radius: 50%; padding: 10px;" onclick="window.location.href='/'">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
        </button>

        <div class="logo-text">
            <svg class="icon" viewBox="0 0 24 24" style="width:1.1em;height:1.1em;">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            公共聊天室
        </div>
        <div class="header-actions">
            <button class="doodle-btn" id="btn-theme" title="主题切换" style="padding:8px 8px;">
                <svg class="icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5" />
                    <path d="M12 1v2" />
                    <path d="M12 21v2" />
                    <path d="M4.22 4.22l1.42 1.42" />
                    <path d="M18.36 18.36l1.42 1.42" />
                    <path d="M1 12h2" />
                    <path d="M21 12h2" />
                    <path d="M4.22 19.78l1.42-1.42" />
                    <path d="M18.36 5.64l1.42-1.42" />
                </svg>
            </button>
            <button class="doodle-btn" id="btn-toggle-users" title="在线用户" style="padding:8px 8px;">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            </button>
        </div>
    </header>

    <main>
        <div id="lobby-main">
            <div class="lobby-container">
                
                <div id="lobby-has-identity" class="lobby-chat" style="display:none;">
                    <div class="lobby-chat-header">
                        <div class="lobby-title">
                            <svg class="icon" viewBox="0 0 24 24" style="width:20px;height:20px;">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                            </svg>
                            聊天大厅
                        </div>
                        <div id="lobby-connection-status" class="lobby-connection-status">
                            <span class="status-dot"></span> 连接中...
                        </div>
                        <button id="lobby-btn-notify" class="lobby-notify-btn" title="通知已关闭">
                            <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                            </svg>
                        </button>
                    </div>

                    <div id="lobby-reply-preview" class="lobby-reply-preview">
                        <span class="preview-label">回复</span>
                        <span class="preview-text" id="lobby-reply-preview-text"></span>
                        <button class="preview-cancel" id="lobby-reply-preview-cancel">&times;</button>
                    </div>

                    
                    <div id="lobby-messages" class="lobby-messages"></div>

                    
                    <div class="lobby-input-area">
                        <div class="input-inner">
                            <input type="text" id="lobby-chat-input" maxlength="500" placeholder="说点什么..." autocomplete="off">
                            <button class="sticker-btn" id="lobby-btn-sticker" title="发送表情">
                                <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;">
                                    <rect x="3" y="3" width="18" height="18" rx="3" />
                                    <circle cx="8.5" cy="8.5" r="1.5" />
                                    <circle cx="15.5" cy="8.5" r="1.5" />
                                    <path d="M8 14c0 0 1.5 2 4 2s4-2 4-2" />
                                </svg>
                            </button>
                        </div>
                        <button id="lobby-btn-send" class="doodle-btn send-btn">
                            <svg class="icon" viewBox="0 0 24 24">
                                <line x1="22" y1="2" x2="11" y2="13"/>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                            发送
                        </button>
                    </div>
                </div>

                
                <div id="lobby-no-identity" class="lobby-identity-card" style="display:none;">
                    <div class="id-card-inner">
                        <div class="id-icon">?</div>
                        <h2>您还没有身份记录</h2>
                        <p>输入昵称和恢复码可以立即恢复您的战绩和身份</p>
                        <input type="text" id="lobby-recover-nickname" class="tag-input" maxlength="12" placeholder="你的昵称" autocomplete="off">
                        <div class="recover-row">
                            <input type="text" id="lobby-recover-input" placeholder="输入恢复码..." maxlength="32">
                            <button id="lobby-btn-recover" class="doodle-btn" style="flex-shrink:0;font-size:14px;">恢复</button>
                        </div>
                        <div id="lobby-recover-msg" class="recover-msg"></div>
                        <div class="divider">或者</div>
                        <button id="lobby-btn-go-home" class="doodle-btn btn-full">返回首页创建身份</button>
                        <button id="lobby-btn-new-name" class="doodle-btn btn-full" style="border-style:dashed;">直接填写昵称</button>
                    </div>
                </div>

                
                <div id="lobby-fill-name" class="lobby-identity-card" style="display:none;">
                    <div class="id-card-inner">
                        <svg class="icon" viewBox="0 0 24 24" style="width:44px;height:44px;stroke:var(--ink-blue);margin-bottom:8px;">
                            <circle cx="12" cy="8" r="4"/>
                            <path d="M4 20c0-4 4-7 8-7s8 3 8 7"/>
                        </svg>
                        <h2>设定你的昵称</h2>
                        <p>进入后会自动生成恢复码，用于跨模式保留身份</p>
                        <input type="text" id="lobby-nickname-input" class="tag-input" maxlength="12" placeholder="你的昵称" autocomplete="off">
                        <button id="lobby-btn-join" class="doodle-btn success btn-full" style="margin-top:16px;font-size:16px;">
                            <svg class="icon" viewBox="0 0 24 24">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                            </svg>
                            进入聊天室
                        </button>
                    </div>
                </div>

                
                <div id="lobby-users-panel" class="lobby-users" style="display:none;">
                    <h3>
                        <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                            <circle cx="9" cy="7" r="4"/>
                        </svg>
                        在线 <span class="count-num" id="lobby-users-count">0</span>
                    </h3>
                    <div id="lobby-users-list"></div>
                </div>
            </div>
        </div>
    </main>

    
    <div id="lobby-sticker-picker" class="sticker-picker" style="display:none;">
        <div class="sticker-picker-header">
            <span>选择表情</span>
            <button class="doodle-btn" id="lobby-btn-manage-sticker" style="padding:2px 8px;font-size:12px;">管理</button>
            <button class="doodle-btn" id="lobby-btn-close-sticker-picker" style="padding:2px 8px;font-size:14px;">&times;</button>
        </div>
        <div class="sticker-picker-tabs">
            <span class="sticker-picker-tab active" data-tab="all">全部</span>
            <span class="sticker-picker-tab" data-tab="favs">收藏</span>
        </div>
        <div class="sticker-picker-body" id="lobby-sticker-picker-body">
            <div style="text-align:center;color:#999;padding:20px;font-size:13px;">暂无可用表情</div>
        </div>
    </div>

    
    <div id="lobby-sticker-lightbox" style="display:none;">
        <div class="sticker-lightbox-bg"></div>
        <img id="lobby-sticker-lightbox-img" src="" alt="">
        <button id="lobby-sticker-lightbox-close" class="doodle-btn"
            style="position:absolute;top:12px;right:12px;padding:4px 8px;font-size:18px;line-height:1;">&times;</button>
    </div>

    <script src="/lobby/lobby.js?v="></script>
</body>
</html>
