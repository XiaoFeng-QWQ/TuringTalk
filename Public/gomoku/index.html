<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2c3e50">
    <title>五子棋</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- ---------- 字体 ---------- -->
    <link rel="preconnect" href="https://s4.zstatic.net" crossorigin>
    <link rel="stylesheet" href="https://s4.zstatic.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
    <link rel="stylesheet" href="https://s4.zstatic.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css">

    <style>
    @font-face{
      font-family:'Patrick Hand'; font-style:normal; font-weight:400; font-display:swap;
      src:url('https://s4.zstatic.net/npm/@fontsource/patrick-hand@5.0.13/files/patrick-hand-latin-400-normal.woff2') format('woff2');
    }
    @font-face{
      font-family:'Caveat'; font-style:normal; font-weight:400; font-display:swap;
      src:url('https://s4.zstatic.net/npm/@fontsource/caveat@5.0.16/files/caveat-latin-400-normal.woff2') format('woff2');
    }
    @font-face{
      font-family:'Caveat'; font-style:normal; font-weight:700; font-display:swap;
      src:url('https://s4.zstatic.net/npm/@fontsource/caveat@5.0.16/files/caveat-latin-700-normal.woff2') format('woff2');
    }
    </style>
    <link rel="stylesheet" href="/style.css?v=">
    <link rel="stylesheet" href="/gomoku/gomoku.css?v=">
</head>

<body>

    <div id="announcement-area"></div>

    <header>
        <button class="doodle-btn" id="btn-back" style="border-radius: 50%; padding: 10px;" title="返回">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
        </button>
        <div class="logo-text">
            <svg class="icon" viewBox="0 0 24 24">
                <circle cx="7" cy="7" r="5" fill="currentColor" />
                <circle cx="17" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.5" />
                <circle cx="12" cy="17" r="5" fill="none" stroke="currentColor" stroke-width="1.5" />
                <line x1="2" y1="22" x2="9" y2="15" stroke="currentColor" stroke-width="2" />
            </svg>
            五子棋
        </div>
        <div class="header-actions">
            <button class="doodle-btn" id="btn-theme" title="主题切换" style="padding:8px 8px;">
                <svg class="icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5" />
                    <path d="M12 1v2" /><path d="M12 21v2" />
                    <path d="M4.22 4.22l1.42 1.42" /><path d="M18.36 18.36l1.42 1.42" />
                    <path d="M1 12h2" /><path d="M21 12h2" />
                    <path d="M4.22 19.78l1.42-1.42" /><path d="M18.36 5.64l1.42-1.42" />
                </svg>
            </button>
        </div>
    </header>

    <main>
        <!-- 身份卡片（无身份记录时显示） -->
        <section id="identity-card" class="doodle-border" style="display:none;">
            <div class="identity-inner">
                <h2>您还没有身份记录</h2>
                <p>输入恢复码可以立即恢复您的战绩和身份</p>
                <div class="recover-row">
                    <input type="text" id="identity-recover-input" placeholder="输入恢复码..." maxlength="32">
                    <button id="identity-btn-recover" class="doodle-btn" style="flex-shrink:0;">恢复</button>
                </div>
                <div id="identity-recover-msg" class="recover-msg" style="display:none;"></div>
                <div class="divider">或者</div>
                <button id="identity-btn-new" class="doodle-btn btn-full" style="border-style:dashed;">以新玩家身份开始</button>
            </div>
        </section>

        <!-- 主菜单 -->
        <section id="page-menu">
            <div class="doodle-border menu-card">
                <h1 class="menu-title">棋逢对手</h1>
                <p class="menu-subtitle">一阴一阳之谓道，黑白交错演乾坤。</p>
                <div class="menu-btns">
                    <button class="doodle-btn menu-btn" id="btn-local-ai">
                        <svg class="icon" viewBox="0 0 24 24">
                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2" />
                            <line x1="8" y1="21" x2="16" y2="21" />
                            <line x1="12" y1="17" x2="12" y2="21" />
                        </svg>
                        单机AI弈棋
                    </button>
                    <button class="doodle-btn menu-btn" id="btn-online">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                            <circle cx="9" cy="7" r="4" />
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                            <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                        </svg>
                        真人 在线对弈
                    </button>
                </div>
            </div>
        </section>

        <!-- 设置面板 -->
        <section id="page-setup" style="display:none;">
            <div class="doodle-border setup-card">
                <h2 id="setup-title">对局设置</h2>

                <div class="setting-group">
                    <div class="setting-label">游戏模式</div>
                    <div class="radio-row">
                        <label class="radio-item"><input type="radio" name="mode" value="normal" checked><span>普通对弈</span></label>
                        <label class="radio-item"><input type="radio" name="mode" value="time"><span>限时决断</span></label>
                    </div>
                </div>

                <div class="setting-group" id="time-setting" style="display:none;">
                    <div class="setting-label">时间限制</div>
                    <div class="radio-row">
                        <label class="radio-item"><input type="radio" name="timeLimit" value="180" checked><span>3分钟</span></label>
                        <label class="radio-item"><input type="radio" name="timeLimit" value="300"><span>5分钟</span></label>
                        <label class="radio-item"><input type="radio" name="timeLimit" value="600"><span>10分钟</span></label>
                    </div>
                </div>

                <div class="setting-group" id="ai-difficulty-group">
                    <div class="setting-label">电脑棋力</div>
                    <div class="radio-row">
                        <label class="radio-item"><input type="radio" name="difficulty" value="beginner"><span>初出茅庐</span></label>
                        <label class="radio-item"><input type="radio" name="difficulty" value="normal" checked><span>棋院国手</span></label>
                        <label class="radio-item"><input type="radio" name="difficulty" value="master"><span>一代宗师</span></label>
                    </div>
                </div>

                <div class="setting-group">
                    <div class="setting-label">棋盘纵横</div>
                    <div class="radio-row">
                        <label class="radio-item"><input type="radio" name="boardSize" value="11"><span>11×11</span></label>
                        <label class="radio-item"><input type="radio" name="boardSize" value="13"><span>13×13</span></label>
                        <label class="radio-item"><input type="radio" name="boardSize" value="15" checked><span>15×15</span></label>
                        <label class="radio-item"><input type="radio" name="boardSize" value="custom"><span>自定义</span></label>
                    </div>
                    <div id="custom-size-area" class="custom-size-area" style="display:none;">
                        <input type="number" id="custom-board-size" class="doodle-input" value="17" min="5" max="30" placeholder="5-30">
                    </div>
                </div>

                <div class="setting-group" id="color-group">
                    <div class="setting-label">执子选择 (黑子先手)</div>
                    <div class="radio-row">
                        <label class="radio-item"><input type="radio" name="firstMove" value="host" checked><span id="color-host-label">玩家执黑</span></label>
                        <label class="radio-item"><input type="radio" name="firstMove" value="guest"><span id="color-guest-label">电脑执黑</span></label>
                    </div>
                </div>

                <div class="setting-actions">
                    <button class="doodle-btn" id="btn-setup-back">返回</button>
                    <button class="doodle-btn" id="btn-setup-start">开局落子</button>
                </div>
            </div>
        </section>

        <!-- 在线 - 创建/等待面板 -->
        <section id="page-wait" style="display:none;">
            <div class="doodle-border wait-card">
                <h2>等待落座</h2>
                <p>对局凭证：</p>
                <div class="room-code" id="wait-code">-----</div>
                <p class="hint">将此凭证告知对手，双方即可对弈。</p>
                <button class="doodle-btn" id="btn-wait-cancel" style="margin-top:20px;color:var(--danger);border-color:var(--danger);">撤去棋盘</button>
            </div>
        </section>

        <!-- 在线 - 加入面板 -->
        <section id="page-join" style="display:none;">
            <div class="doodle-border join-card">
                <h2>入局切磋</h2>
                <p>请输入对方提供的 5 位凭证：</p>
                <input type="text" id="join-code" class="room-code-input" maxlength="5" autocomplete="off" placeholder="ABCDE">
                <div class="setting-actions" style="margin-top:20px;">
                    <button class="doodle-btn" id="btn-join-back">返回</button>
                    <button class="doodle-btn" id="btn-join-room">落 座</button>
                </div>
            </div>
        </section>

        <!-- 对局面板 -->
        <section id="page-game" style="display:none;">
            <div class="game-layout">
                <div class="game-board-area">
                    <div class="game-info-bar">
                        <div class="player-info" id="info-you">
                            <span class="stone-dot black"></span>
                            <span>你</span>
                        </div>
                        <div class="turn-display" id="turn-display">黑棋行棋</div>
                        <div class="timer-display" id="timer-display" style="display:none;">03:00</div>
                        <div class="player-info" id="info-opponent">
                            <span class="stone-dot white"></span>
                            <span id="opponent-name">对手</span>
                        </div>
                    </div>
                    <canvas id="boardCanvas"></canvas>
                    <div class="game-actions" id="game-actions">
                        <button class="doodle-btn" id="btn-surrender" style="color:var(--danger);border-color:var(--danger);">推枰认输</button>
                        <button class="doodle-btn" id="btn-rematch" style="display:none;">再弈一局</button>
                        <button class="doodle-btn" id="btn-game-leave" style="color:var(--text-subtle);">退出</button>
                    </div>
                </div>

                <div class="game-chat-area" id="chat-area">
                    <div class="chat-header">
                        <span>飞鸽传书</span>
                        <span id="spectator-badge" style="display:none;font-size:12px;color:var(--warn);">观战中</span>
                    </div>
                    <div class="chat-messages" id="chat-messages">
                        <div class="chat-msg sys">对局开始，落子为定</div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" placeholder="说点什么…" maxlength="300" autocomplete="off">
                        <button class="doodle-btn" id="btn-chat-send">发送</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 对局结束覆盖层 -->
        <div id="gameover-overlay" style="display:none;">
            <div class="doodle-border gameover-card">
                <h2 id="gameover-title">对局结束</h2>
                <p id="gameover-reason"></p>
                <div class="gameover-actions">
                    <button class="doodle-btn" id="btn-gameover-rematch">再弈一局</button>
                    <button class="doodle-btn" id="btn-gameover-leave" style="color:var(--text-subtle);">退出</button>
                </div>
            </div>
        </div>

    </main>

    <script src="/shared.js?v="></script>
    <script src="/gomoku/gomoku.js?v="></script>
</body>

</html>
