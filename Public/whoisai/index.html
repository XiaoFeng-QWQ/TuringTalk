<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>?! 谁是AI !?</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="theme-color" content="#2c3e50">
    <!-- ---------- 字体 ---------- -->
    <link rel="preconnect" href="https://s4.zstatic.net" crossorigin>
    <link rel="stylesheet" href="https://s4.zstatic.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css">
    <link rel="stylesheet" href="https://s4.zstatic.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css">

    <style>
    @font-face{
      font-family:'Patrick Hand'; font-style:normal; font-weight:400; font-display:swap;
      src:url('https://s4.zstatic.net/npm/@fontsource/patrick-hand@5.0.13/files/patrick-hand-latin-400-normal.woff2') format('woff2');
    }
    @font-face{
      font-family:'Caveat'; font-style:normal; font-weight:400; font-display:swap;
      src:url('https://s4.zstatic.net/npm/@fontsource/caveat@5.0.16/files/caveat-latin-400-normal.woff2') format('woff2');
    }
    @font-face{
      font-family:'Caveat'; font-style:normal; font-weight:700; font-display:swap;
      src:url('https://s4.zstatic.net/npm/@fontsource/caveat@5.0.16/files/caveat-latin-700-normal.woff2') format('woff2');
    }
    </style>
    <link rel="stylesheet" href="/style.css?v=">
    <link rel="stylesheet" href="/whoisai/whoisai.css?v=">
    <script src="https://testingcf.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>
    <script src="/shared.js?v="></script>
</head>

<body>

    <div id="announcement-area"></div>

    <header>
        <button class="doodle-btn" id="btn-back" style="border-radius: 50%; padding: 10px;"
            onclick="window.location.href='/'">
            <svg class="icon" viewBox="0 0 24 24">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
        </button>

        <div class="logo-text">?! 谁是AI !?</div>
        <div class="header-actions">
            <button class="doodle-btn" id="btn-theme" title="主题切换" style="padding:8px 8px;">
                <svg class="icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="5" />
                    <path d="M12 1v2" />
                    <path d="M12 21v2" />
                    <path d="M4.22 4.22l1.42 1.42" />
                    <path d="M18.36 18.36l1.42 1.42" />
                    <path d="M1 12h2" />
                    <path d="M21 12h2" />
                    <path d="M4.22 19.78l1.42-1.42" />
                    <path d="M18.36 5.64l1.42-1.42" />
                </svg>
            </button>
        </div>
    </header>

    <main>

        <section id="whoisai-match-panel">
            <div class="sticky-hero" style="max-width:440px;">
                <div style="color:var(--ink-blue);font-size:16px;margin-bottom:8px;"># 在线实验 02</div>
                <h1 class="hero-title">?! 谁是AI !?</h1>
                <p class="hero-subtitle">多人混战找出隐藏的AI · 投票淘汰 · 全歼AI则人类胜</p>
            </div>

            <div class="id-card doodle-border whoisai-match-card">

                <div id="whoisai-has-identity" style="display:none;text-align:center;width:100%;">
                    <svg class="icon" viewBox="0 0 24 24"
                        style="width:48px;height:48px;stroke:var(--ink-blue);margin-bottom:8px;">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 20c0-4 4-7 8-7s8 3 8 7" />
                    </svg>
                    <h2 style="font-size:20px;margin:0 0 4px;">欢迎回来，<span id="whoisai-hello-nickname"></span></h2>
                    <p style="color:var(--text-secondary);font-size:13px;margin:0 0 20px;">4~6人匹配对局，随机混入AI</p>
                    <button id="whoisai-match-btn-authed" class="doodle-btn success"
                        style="width:100%;justify-content:center;font-size:16px;">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M22 2L11 13" />
                            <path d="M22 2l-7 20-4-9-9-4 20-7z" />
                        </svg>
                        开始匹配
                    </button>
                </div>


                <div id="whoisai-no-identity" style="display:none;text-align:center;width:100%;">
                    <div style="font-size:48px;margin-bottom:8px;">?</div>
                    <h2 style="font-size:18px;margin:0 0 4px;color:var(--text-secondary);">您还没有身份记录</h2>
                    <p style="color:var(--text-secondary);font-size:13px;margin:0 0 16px;">输入昵称和恢复码可以立即恢复您的战绩和身份</p>
                    <input type="text" id="whoisai-recover-nickname" class="tag-input" maxlength="12" placeholder="你的昵称"
                        autocomplete="off" style="width:100%;text-align:center;font-size:16px;margin-bottom:10px;">
                    <div style="display:flex;gap:6px;margin-bottom:12px;">
                        <input type="text" id="whoisai-recover-input" placeholder="输入恢复码..." maxlength="32"
                            style="flex:1;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:14px;background:var(--bg-input);color:var(--text);">
                        <button id="whoisai-btn-recover" class="doodle-btn"
                            style="flex-shrink:0;font-size:14px;">恢复</button>
                    </div>
                    <div id="whoisai-recover-msg"
                        style="font-size:12px;color:var(--danger);margin-bottom:10px;display:none;"></div>
                    <div
                        style="display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--text-secondary);font-size:12px;">
                        <span style="flex:1;height:1px;background:var(--ink-blue);opacity:0.2;"></span>
                        或者
                        <span style="flex:1;height:1px;background:var(--ink-blue);opacity:0.2;"></span>
                    </div>
                    <button id="whoisai-btn-go-home" class="doodle-btn"
                        style="width:100%;justify-content:center;margin-bottom:12px;font-size:15px;">
                        返回首页创建身份
                    </button>
                    <button id="whoisai-btn-new-name" class="doodle-btn"
                        style="width:100%;justify-content:center;font-size:15px;border-style:dashed;">
                        直接填写昵称
                    </button>
                </div>


                <div id="whoisai-fill-name" style="display:none;text-align:center;width:100%;">
                    <svg class="icon" viewBox="0 0 24 24"
                        style="width:48px;height:48px;stroke:var(--ink-blue);margin-bottom:8px;">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 20c0-4 4-7 8-7s8 3 8 7" />
                    </svg>
                    <h2 style="font-size:20px;margin:0 0 4px;">设定你的昵称</h2>
                    <p style="color:var(--text-secondary);font-size:13px;margin:0 0 20px;">对局结束后会自动生成恢复码</p>
                    <input type="text" id="whoisai-nickname" class="tag-input" maxlength="12" placeholder="你的昵称"
                        autocomplete="off" style="width:100%;text-align:center;font-size:18px;">
                    <button id="whoisai-match-btn" class="doodle-btn success"
                        style="width:100%;justify-content:center;margin-top:12px;font-size:16px;">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M22 2L11 13" />
                            <path d="M22 2l-7 20-4-9-9-4 20-7z" />
                        </svg>
                        开始匹配
                    </button>
                </div>

                <div id="whoisai-match-status" class="whoisai-match-status"></div>
                <div id="whoisai-match-tips" class="whoisai-match-tips"></div>
                <div id="whoisai-pool-list" class="whoisai-pool-list"></div>
            </div>
        </section>

        <section id="whoisai-game-panel" class="whoisai-game-panel" style="display:none;">
            <div class="whoisai-notebook">
                <div id="whoisai-game-header" class="whoisai-game-header">
                    <div class="whoisai-timer" id="whoisai-timer">5:00</div>
                    <div class="whoisai-round" id="whoisai-round">讨论 · 第1轮</div>
                    <div class="whoisai-my-identity" id="whoisai-my-identity">
                        <span id="whoisai-identity-badge">人类</span>
                    </div>
                </div>

                <div class="whoisai-main">
                    <aside id="whoisai-player-panel" class="whoisai-player-panel">
                        <h3>
                            <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                                <circle cx="9" cy="7" r="4" />
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                            </svg>
                            存活 <span id="whoisai-alive-count">0</span>
                        </h3>
                        <div id="whoisai-player-list"></div>
                    </aside>

                    <div class="whoisai-content">
                        <div class="whoisai-chat-box">
                            <div id="whoisai-messages" class="whoisai-messages"></div>
                        </div>
                        <div id="whoisai-input-area" class="whoisai-input-area" style="display:none;">
                            <button class="sticker-btn" id="whoisai-btn-sticker" title="发送表情" style="margin-right:4px;">
                                <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;">
                                    <rect x="3" y="3" width="18" height="18" rx="3" />
                                    <circle cx="8.5" cy="8.5" r="1.5" />
                                    <circle cx="15.5" cy="8.5" r="1.5" />
                                    <path d="M8 14c0 0 1.5 2 4 2s4-2 4-2" />
                                </svg>
                            </button>
                            <input type="text" id="whoisai-chat-input" maxlength="300" placeholder="输入你的推理..."
                                autocomplete="off">
                            <button id="whoisai-chat-send" class="doodle-btn">
                                <svg class="icon" viewBox="0 0 24 24">
                                    <line x1="22" y1="2" x2="11" y2="13" />
                                    <polygon points="22 2 15 22 11 13 2 9 22 2" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div id="whoisai-vote-panel" class="whoisai-vote-panel" style="display:none;">
                    <h3>
                        <svg class="icon" viewBox="0 0 24 24" style="width:18px;height:18px;">
                            <polyline points="9 11 12 14 22 4" />
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
                        </svg>
                        投票选出 AI
                    </h3>
                    <div id="whoisai-vote-candidates" class="whoisai-vote-candidates"></div>
                    <div id="whoisai-vote-status" class="whoisai-vote-status"></div>
                </div>
            </div>

            <div id="whoisai-end-overlay" class="whoisai-end-overlay" style="display:none;">
                <div id="whoisai-end-card" class="agreement-drawer whoisai-end-card">
                    <div class="paper-content"></div>
                </div>
            </div>
        </section>
    </main>


    <div id="whoisai-sticker-picker" class="sticker-picker" style="display:none;">
        <div class="sticker-picker-header">
            <span>选择表情</span>
            <button class="doodle-btn" id="whoisai-btn-close-sticker-picker"
                style="padding:2px 8px;font-size:14px;">&times;</button>
        </div>
        <div class="sticker-picker-tabs">
            <span class="sticker-picker-tab active" data-tab="mine">我的表情</span>
            <span class="sticker-picker-tab" data-tab="default">默认表情</span>
        </div>
        <div class="sticker-picker-body" id="whoisai-sticker-picker-body">
            <div style="text-align:center;color:#999;padding:20px;font-size:13px;">暂无可用表情</div>
        </div>
    </div>

    <div id="whoisai-sticker-lightbox" style="display:none;">
        <div class="sticker-lightbox-bg"></div>
        <img id="whoisai-sticker-lightbox-img" src="" alt="">
        <button id="whoisai-sticker-lightbox-close" class="doodle-btn"
            style="position:absolute;top:12px;right:12px;padding:4px 8px;font-size:18px;line-height:1;">&times;</button>
    </div>

    <script src="/whoisai/whoisai.js?v="></script>
</body>

</html>
