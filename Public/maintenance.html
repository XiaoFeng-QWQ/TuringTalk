<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>数据升级中 — 更好的图灵测试</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="theme-color" content="#2c3e50">
    <link rel="stylesheet" href="/style.css?v=">
</head>

<body>
    <header>
        <div class="logo-text">
            <svg class="icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8" />
                <path d="M21 21l-4.35-4.35" />
            </svg>
            图灵测试小游戏
        </div>
    </header>

    <main>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;padding:20px;text-align:center;">

            <div style="margin-bottom:24px;">
                <svg class="icon" viewBox="0 0 24 24" style="width:64px;height:64px;stroke:var(--ink-blue);">
                    <path d="M12 2v4" />
                    <path d="M12 18v4" />
                    <path d="M4.93 4.93l2.83 2.83" />
                    <path d="M17.17 17.17l2.83 2.83" />
                    <path d="M2 12h4" />
                    <path d="M18 12h4" />
                    <path d="M4.93 19.07l2.83-2.83" />
                    <path d="M17.17 6.83l2.83-2.83" />
                </svg>
            </div>

            <h1 class="hero-title" style="font-size:32px;">
                数据升级中
            </h1>

            <p class="hero-subtitle" style="margin-top:8px;font-size:16px;">
                预计 <strong>10 分钟</strong>内完成
            </p>

            <div class="doodle-border" style="margin-top:28px;padding:28px 36px;width:min(440px,90vw);text-align:left;background:var(--note-blue);transform:rotate(-0.5deg);">
                <p style="font-size:15px;line-height:1.8;margin-bottom:16px;">
                    <strong>升级内容：</strong>恢复码已升级为密码
                </p>

                <div style="background:var(--surface-white);border-radius:12px;padding:16px 20px;margin-bottom:16px;border:1.5px solid var(--ink-black);">
                    <p style="font-size:14px;margin-bottom:8px;color:var(--text-secondary);">
                        <svg class="icon" viewBox="0 0 24 24" style="width:14px;height:14px;">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        <strong>登录方式</strong>
                    </p>
                    <ul style="font-size:14px;color:var(--text-secondary);padding-left:20px;line-height:1.8;">
                        <li><strong>用户名</strong> → 填你的昵称</li>
                        <li><strong>密码</strong> → 填旧的恢复码</li>
                    </ul>
                </div>

                <p style="font-size:13px;color:var(--text-muted);line-height:1.6;">
                    <svg class="icon" viewBox="0 0 24 24" style="width:13px;height:13px;">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    升级完成后恢复码将不再使用，请使用新密码登录。如有疑问可加入官方 QQ 群获取帮助。
                </p>
            </div>

            <a href="https://qm.qq.com/q/Q2mkYzax4A" target="_blank" rel="noopener"
                class="doodle-btn"
                style="margin-top:24px;font-size:15px;padding:12px 28px;text-decoration:none;color:var(--ink-black);border-color:var(--ink-blue);">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                </svg>
                点击加入官方QQ群：NekoNeko
            </a>

            <p style="margin-top:40px;font-size:12px;color:var(--text-subtle);">
                感谢你的耐心等待 &hearts;
            </p>
        </div>
    </main>

</body>

</html>
